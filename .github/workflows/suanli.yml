# 蒜狸发行：把插件打成 tgz 发布到 dist 分支，再给宿主开升级 PR。
#
# 小助手安装的是发行包本身，不是 npm 上的版本：宿主把 tgz 作为依赖，打包安装包时再用
# `stage-external-packages` 取下来放进安装包，用户侧不联网。所以这条工作流只做一件事——
# `main` 上有代码改动（只改文档不算）就跑 typecheck 和 `pnpm test`（反向校验约 45 分钟，
# 放在 negative.yml 每天跑），通过后把 `pnpm pack` 的产物提交到 `dist` 分支，文件名固定为
# `<包名>-<版本>.tgz`（宿主的打包脚本按 `^[a-zA-Z0-9][a-zA-Z0-9._-]*\.tgz$` 匹配）。
# 版本号由 `scripts/suanli-version.mjs` 决定。最后用 `HOST_REPO_TOKEN` 给
# reputationly/deepseek-harness 开或更新 `bot/dsh-imagegen-video` 升级 PR 并开启自动合并，
# 宿主 CI 通过就合进 master；没配这个 secret 时只发布到 dist。
name: Suanli release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: suanli-release
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish the tarball
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # 测试链里的帧抽取与界面契约检查需要 ffmpeg 和无头浏览器，缺了会判失败；
      # 与 ci.yml 装同样的两样东西。
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install chrome-headless-shell
        run: |
          set -euo pipefail
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable \
            --path "$HOME/.cache/chrome-headless"
          SHELL_BIN=$(find "$HOME/.cache/chrome-headless" -name 'chrome-headless-shell' -type f | head -1)
          test -n "$SHELL_BIN"
          echo "CHROME_HEADLESS_SHELL=$SHELL_BIN" >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # 重跑旧的 run 时 main 已经变了：只有 main 是本提交之后只改了文档（含移入/移出的
      # 原路径）才照常发布；否则由更新的 run 发布，旧代码不能以更高的构建号盖过新包。
      - name: Pick the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$head" --jq '.status, (.files[] | .filename, (.previous_filename // empty))')
            status=$(printf '%s\n' "$compare" | sed -n 1p)
            newer=$(printf '%s\n' "$compare" | sed 1d | grep -Ev '^docs/|\.md$' || true)
            if [ "$status" != ahead ] || [ -n "$newer" ]; then
              echo "::notice::main is at $head ($status) with other code; this run does not publish"
              exit 0
            fi
          fi
          releases=""
          if git fetch -q --depth 1 origin dist 2>/dev/null; then
            releases=$(git show FETCH_HEAD:RELEASES.txt 2>/dev/null || true)
          fi
          # 这个提交已经发过（上次推完 dist、宿主 PR 没开成功后重跑）：是最新一版就沿用它、只补宿主 PR；
          # 之后又发过（例如文档提交手动重发），宿主该升到更新的那版，这次不动。
          released=$(printf '%s\n' "$releases" | awk -v sha="$GITHUB_SHA" '$4 == sha { line = $0 } END { print line }')
          latest=$(printf '%s\n' "$releases" | awk 'NF { line = $0 } END { print line }')
          if [ -n "$released" ] && [ "$released" != "$latest" ]; then
            echo "::notice::$GITHUB_SHA was released before a newer build; this run does not touch the host"
            exit 0
          fi
          if [ -n "$released" ]; then
            read -r package version archive _ <<< "$released"
            {
              echo "version=$version"
              echo "reused=true"
              echo "package=$package"
              echo "url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$(git rev-parse FETCH_HEAD)/$archive"
            } >> "$GITHUB_OUTPUT"
            echo "$GITHUB_SHA is already on dist as $version; reusing it"
            exit 0
          fi
          version=$(printf '%s\n' "$releases" | node scripts/suanli-version.mjs next)
          node scripts/suanli-version.mjs stamp "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing $version"
        shell: bash

      - name: Pack
        if: steps.version.outputs.version != '' && steps.version.outputs.reused != 'true'
        run: pnpm pack

      # dist 分支只追加：宿主按提交号固定 raw 地址，改写历史会让已发布的地址失效。
      # 同一个版本已经发过就停下，不覆盖；要重发请先改 package.json 的 version。
      - name: Publish to the dist branch
        if: steps.version.outputs.version != '' && steps.version.outputs.reused != 'true'
        id: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=$(ls *.tgz | head -1)
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # 临时仓库拿不到 checkout 写在本地配置里的令牌，推送地址自带令牌。
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work=$(mktemp -d)
          if git ls-remote --exit-code --heads "$remote" dist >/dev/null; then
            git clone -q --branch dist --single-branch "$remote" "$work"
          else
            git init -q "$work"
            git -C "$work" checkout -q --orphan dist
          fi
          if [ -e "$work/$archive" ]; then
            echo "::error::$archive is already on dist; versions are never republished"
            exit 1
          fi
          cp "$archive" "$work/"
          printf '%s %s %s %s\n' "$package" "$version" "$archive" "$GITHUB_SHA" >> "$work/RELEASES.txt"
          git -C "$work" add .
          git -C "$work" -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "dist: $package@$version"
          git -C "$work" push "$remote" "HEAD:refs/heads/dist"
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$(git -C "$work" rev-parse HEAD)/$archive"
          echo "dependency URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          rm -rf "$work"
        shell: bash

      # 宿主 PR 由个人令牌推送，宿主的 PR CI 才会运行（GITHUB_TOKEN 推送的提交不触发工作流）。
      # 同一个分支每次整份重建，PR 里始终只有最新一版的升级。
      - name: Open the host upgrade pull request
        if: steps.version.outputs.version != ''
        env:
          HOST_TOKEN: ${{ secrets.HOST_REPO_TOKEN }}
          HOST_REPO: reputationly/deepseek-harness
          BRANCH: bot/dsh-imagegen-video
          PACKAGE: ${{ steps.dist.outputs.package || steps.version.outputs.package }}
          URL: ${{ steps.dist.outputs.url || steps.version.outputs.url }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$HOST_TOKEN" ]; then
            echo "::warning::HOST_REPO_TOKEN is not set; $VERSION is on dist but the host was not upgraded"
            exit 0
          fi
          host=$(mktemp -d)
          git clone -q --depth 1 "https://x-access-token:${HOST_TOKEN}@github.com/${HOST_REPO}.git" "$host"
          cd "$host"
          git checkout -q -B "$BRANCH"
          node -e '
            const fs = require("fs")
            const file = "apps/cli/package.json"
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"))
            const [name, url] = process.argv.slice(1)
            if (!(name in manifest.dependencies)) throw new Error(`${file} does not depend on ${name}`)
            manifest.dependencies[name] = url
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n")
          ' "$PACKAGE" "$URL"
          pnpm install --lockfile-only --ignore-scripts
          if git diff --quiet; then
            echo "the host already depends on $URL"
            exit 0
          fi
          title="创作插件升级到 $VERSION"
          # 升级分支已经是这次的改动时不重推，免得宿主 CI 重跑；PR 和自动合并照样补齐。
          if git fetch -q --depth 1 origin "refs/heads/$BRANCH" 2>/dev/null \
            && git diff --quiet FETCH_HEAD -- apps/cli/package.json pnpm-lock.yaml; then
            echo "$BRANCH already carries this upgrade; not pushing again"
          else
            git add apps/cli/package.json pnpm-lock.yaml
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
              commit -q -m "$title" -m "插件提交 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            git push -q -f origin "HEAD:refs/heads/$BRANCH"
          fi
          body="由 ${GITHUB_REPOSITORY} 的发行工作流自动生成：插件 \`main\` 的 ${GITHUB_SHA} 打包为 \`$VERSION\`，依赖地址按 \`dist\` 提交号固定。宿主 CI 通过后自动合并。

          运行记录：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          export GH_TOKEN="$HOST_TOKEN"
          number=$(gh pr list -R "$HOST_REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create -R "$HOST_REPO" --base master --head "$BRANCH" --title "$title" --body "$body"
          else
            gh pr edit "$number" -R "$HOST_REPO" --title "$title" --body "$body"
          fi
          gh pr merge "$BRANCH" -R "$HOST_REPO" --auto --merge \
            || echo "::warning::could not enable auto-merge on $HOST_REPO; turn on Allow auto-merge in its settings, or merge the pull request by hand"
        shell: bash

      - name: Report
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REUSED: ${{ steps.version.outputs.reused }}
        run: |
          if [ "$REUSED" = true ]; then
            echo "$VERSION was already on the dist branch; only the host upgrade was retried"
          else
            echo "published $VERSION to the dist branch"
          fi
